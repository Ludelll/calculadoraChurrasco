<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora do churras</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Vamos calcular quanto de carne você precisa pro seu churrasco.</h1>
    <h2>Primeiro você precisa digitar quantas pessoas vão nesse churrasco: </h2>
    <h3>Quantas dessas pessoas são homens: </h3>
    <input type="number" id="calcMen">
    <h3>Quantas dessas pessoas são mulheres: </h3>
    <input type="number" id="calcWomen">
    <h3>Quantas dessas pessoas são crianças: </h3>
    <input type="number" id="calcChild">
    
    <button id="calcButton">Clique aqui para fazer o cálculo</button>

    <div id="calcDiv">Quantidade necessária</div>





    <script src="teste.js"></script>
</body>
</html>
